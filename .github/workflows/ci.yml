name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI package
        run: cd toc-cli && bun run build && bun install

      - name: Lint
        run: bun run lint

  type:
    name: type
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build CLI package
        run: cd toc-cli && bun run build && bun install

      - name: Typecheck
        run: bun run check

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Credentials match toc-cli/src/constants/database.ts.
    env:
      DATABASE_HOST_URL: postgresql://postgres:test-database@localhost:5432/test?schema=public
    services:
      postgres:
        image: postgres:15.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-database
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI package
        run: cd toc-cli && bun run build && bun install

      - name: Build packages the tests import
        run: bunx turbo run build --filter=@towers-of-coreborn/api --filter=@towers-of-coreborn/database

      - name: Prepare environment file
        run: bun run toc ensure-env

      - name: Test
        run: bun run test
